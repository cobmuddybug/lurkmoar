[project]
name = "lurkmoar"
version = "0.2.0"
description = "Read-only, keyboard-first desktop browser for 4chan and vichan-family imageboards, built for Omarchy"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["imageboard", "4chan", "vichan", "pyside6", "qt", "omarchy", "reader"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["PySide6>=6.6", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lurkmoar = "lurkmoar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lurkmoar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
